# ★ Nuber 平台 Nginx 設定 ★
# 目標域名: Nuber.esggo.co

server {
    listen 80;
    listen [::]:80;
    server_name Nuber.esggo.co www.Nuber.esggo.co;
    
    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name Nuber.esggo.co www.Nuber.esggo.co;
    
    # SSL 設定 (Let's Encrypt 或 Cloudflare)
    ssl_certificate /etc/letsencrypt/live/Nuber.esggo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/Nuber.esggo.co/privkey.pem;
    
    # SSL 安全設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # 根目錄
    root /var/www/Nuber.esggo.co;
    index index.html;
    
    # 5T Protocol 安全標頭
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;
    
    # 靜態檔案快取
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary "";
        access_log off;
    }
    
    # CSS/JS 快取
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary "Accept-Encoding";
        access_log off;
    }
    
    # SPA 路由 - 所有非靜態請求指向 index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # 5T Traceable headers
        add_header X-5T-Protocol "verified" always;
        add_header X-5T-Source "nuber-esggo-co" always;
    }
    
    # 重新寫入規則
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # 錯誤頁面
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
    
    # 禁用預設目錄列印
    autoindex off;
    
    # 日誌
    access_log /var/log/nginx/Nuber.esggo.co.access.log;
    error_log /var/log/nginx/Nuber.esggo.co.error.log;
}